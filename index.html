function qScore(q){const s=S.q[q.id]||{};const p=q.pts||1;

    if(q.length>=4){let per=true;for(let i=2;i<q.length;i++)if(q[i]!==q[i-2])per=false;if(per)return false;let mono=true;for(let i=1;i<q.length;i++)if(q[i]<q[i-1])mono=false;if(mono)return false;}return true;};
  let a=items.slice();for(let t=0;t<300;t++){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}if(ok(a))return a;}return a;}

  const s2=step(L,2,'Try it','Use the simulations. Do the steps in the blue box. They tick by themselves when you do them.');c.sims.forEach(f=>s2.append(f(L)));root.append(s2);

  sc.append(conceptMap(L,c.connect.tid,c.connect.map));c.connect.qs.forEach((q,i)=>sc.append(mkQ(q,L,'C'+(i+1))));root.append(sc);
  /* 4 exercises */

  s4.append(h('div',{class:'card'},h('h4',{},c.case.title),h('p',{html:c.case.story}),figure(c.case.img,c.case.cap,c.case.alt,640)));

  s6.append(h('div',{class:'clue'},h('b',{},'Chapter mystery:'),h('p',{html:'Michelle, 25, ran a marathon in hot, humid weather. She drank a lot of water. She felt weak and confused, collapsed, and at the hospital she had a seizure and fell into a coma.'})));

  return root;}

/* ===== glossary ===== */
defs({'physical change':'A change in shape or state. The substance stays the same (for example, ice melting).','chemical change':'A change that makes new substances. Chemical energy is stored or released (for example, a candle burning).','energy':'The ability to do work.','chemical energy':'Energy stored in chemical bonds.','ATP':'Adenosine triphosphate. A molecule that cells use to store and release energy. It has 3 phosphate groups.','ADP':'Adenosine diphosphate. Like ATP but with only 2 phosphate groups.','phosphate group':'A small group of atoms (P). Adding one to ADP makes ATP.','heterotroph':'A living thing that gets food by eating other living things (or their dead tissue).','autotroph':'A living thing that makes its own food from sunlight or chemicals.','photosynthesis':'The process in which plants and other autotrophs use light energy to change water and carbon dioxide into oxygen and high-energy sugars and starches.','glucose':'A sugar. One glucose stores more than 90 times the energy of one ATP.','pigment':'A light-absorbing molecule.','chlorophyll':'The main pigment of plants. It absorbs blue-violet and red light well, and reflects green.','chloroplast':'The organelle where photosynthesis takes place.','thylakoid':'A flat, bag-shaped photosynthetic membrane inside a chloroplast. It holds chlorophyll.','granum':'A stack of thylakoids. (Plural: grana.)','stroma':'The liquid-filled space around the thylakoids in a chloroplast.','NADP+':'An electron carrier. It accepts 2 high-energy electrons and an H⁺ and becomes NADPH.','NADPH':'The loaded electron carrier. It carries high-energy electrons to the Calvin cycle.','electron carrier':'A compound that can transfer a pair of high-energy electrons, with most of their energy, to another molecule.','reactant':'A substance that goes into a reaction. For photosynthesis: carbon dioxide and water.','product':'A substance made by a reaction. For photosynthesis: sugars and oxygen.','light-dependent reactions':'The first set of photosynthesis reactions. They happen in the thylakoids, need light, and make ATP, NADPH and oxygen.','light-independent reactions':'The second set of photosynthesis reactions (the Calvin cycle). They happen in the stroma and use ATP, NADPH and CO₂ to make sugars.','photosystem':'A cluster of pigments and proteins that absorbs light and gives its energy to electrons.','electron transport chain':'A series of carrier proteins that pass high-energy electrons along and use their energy to pump H⁺ ions.','ATP synthase':'A protein in the thylakoid membrane, like a revolving door. H⁺ ions flowing through it make it turn and add a phosphate to ADP to make ATP.','Calvin cycle':'Another name for the light-independent reactions. It builds high-energy sugars from carbon dioxide.','C4 plant':'A plant (for example corn or sugar cane) with a special pathway that gets carbon into the Calvin cycle even when little CO₂ is available.','CAM plant':'A plant (for example pineapple or cactus) that takes in CO₂ only at night to save water.','wavelength':'The distance between wave peaks. Different wavelengths of light look like different colours.'});

const LES82={id:'p82',num:'8.2',title:'Photosynthesis: An Overview',
 big:'Plants capture light with <b>pigments</b> (mainly <b>chlorophyll</b>) in <b>chloroplasts</b>. Light energy moves to electrons, and <b>electron carriers</b> such as <b>NADP⁺</b> carry them. Photosynthesis turns <b>CO₂ + water</b> into <b>sugars + oxygen</b>.',

 learn:[
  ['1 · Investigating photosynthesis',`<p>Scientists found the parts of photosynthesis step by step.</p><ul><li><b>Jan van Helmont</b>: a willow gained about 75 kg, but the soil lost almost nothing. He said the mass came from <b>water</b>. That was only half the answer.</li><li><b>Joseph Priestley</b>: a mint plant in a closed jar produced a gas (<b>oxygen</b>) that let a candle burn again.</li><li><b>Jan Ingenhousz</b>: showed that plants need <b>light</b> to produce oxygen.</li></ul>`],
  ['2 · Light and pigments',`<p>Sunlight looks white, but it is a mixture of colours (wavelengths). Plants gather the sun’s energy with ${kw('pigment')}s. The most important is ${kw('chlorophyll')}.</p><p>Chlorophyll absorbs <b>blue-violet</b> and <b>red</b> light best. It does <b>not</b> absorb green light well. Leaves look green because they <b>reflect</b> green light.</p>`],
  ['3 · Inside a chloroplast',`<p>Photosynthesis takes place in ${kw('chloroplast')}s. A chloroplast holds many flat, bag-shaped membranes called ${kw('thylakoid')}s, arranged in stacks called <b>grana</b>.</p><p>Chlorophyll and other pigments are in the thylakoid membranes. The liquid around the thylakoids is the ${kw('stroma')}.</p>`],
  ['4 · Electron carriers',`<p>When chlorophyll absorbs light, the energy goes to its <b>electrons</b>. High-energy electrons cannot keep their energy for long, so a <b>carrier</b> takes them.</p><p>${kw('NADP+')} accepts <b>2 high-energy electrons</b> and an <b>H⁺</b> and becomes ${kw('NADPH')}. Like an oven mitt carrying a hot potato.</p>`],
  ['5 · The equation',`<p>In symbols: <b>6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</b> (with light)</p><p>In words: <b>carbon dioxide + water → sugars + oxygen</b></p><p>The ${kw('reactant')}s are CO₂ and water. The ${kw('product')}s are sugars and oxygen. Light is the energy source.</p>`]

const LES83={id:'p83',num:'8.3',title:'The Process of Photosynthesis',
 big:'<b>Light-dependent reactions</b> (thylakoids) use light and water to make <b>ATP, NADPH and oxygen</b>. The <b>Calvin cycle</b> (stroma) uses ATP, NADPH and CO₂ to make <b>sugars</b>. Temperature, light and water change the rate.',
 keyq:['What happens during the light-dependent reactions?','What happens during the light-independent reactions?','What factors affect photosynthesis?'],
 words:['light-dependent reactions','light-independent reactions','photosystem','electron transport chain','ATP synthase','Calvin cycle','C4 plant','CAM plant'],
 learn:[
  ['1 · Two sets of reactions',`<p>Photosynthesis has two sets of reactions. The ${kw('light-dependent reactions')} happen in the <b>thylakoids</b>. The ${kw('light-independent reactions')} happen in the <b>stroma</b>.</p>`],
  ['2 · Light-dependent reactions: part 1',`<p>${kw('photosystem')}s are clusters of chlorophyll and proteins in the thylakoid membrane. <b>Photosystem II</b> absorbs light and releases high-energy electrons.</p><p>The electrons go down the ${kw('electron transport chain')}. The chain uses their energy to <b>pump H⁺ ions</b> inside the thylakoid. Enzymes split <b>water</b> to replace the electrons. <b>Oxygen</b> is released and H⁺ ions stay inside.</p>`],
  ['3 · Light-dependent reactions: part 2',`<p>H⁺ ions build up inside the thylakoid. They can only leave through ${kw('ATP synthase')}, like a <b>revolving door</b>. As it turns, it adds a phosphate to ADP to make <b>ATP</b>.</p><p><b>Photosystem I</b> re-energises the electrons with more light. They go to NADP⁺ to make <b>NADPH</b>. Products: <b>oxygen, ATP, NADPH</b>.</p>`],
  ['4 · The Calvin cycle',`<p>The ${kw('Calvin cycle')} (light-independent reactions) uses <b>ATP</b> and <b>NADPH</b> and <b>CO₂</b> from the air to build high-energy <b>sugars</b>. ATP and NADPH last only a few minutes. Sugars are stable and store energy for a long time.</p><p>CO₂ joins 5-carbon molecules. Some 3-carbon molecules leave to make sugars. The rest are rebuilt with ATP, so the cycle repeats.</p>`],
  ['5 · Factors affecting photosynthesis',`<p><b>Temperature</b>: enzymes work best between 0 °C and 35 °C. <b>Light intensity</b>: very bright light speeds it up. <b>Water</b>: when water is low, plants close leaf openings and less CO₂ enters.</p>`],
  ['6 · Extreme conditions',`<p>${kw('C4 plant')}s (corn, sugar cane) have a special pathway that gets carbon in even when CO₂ is low. ${kw('CAM plant')}s (pineapple, cacti, ice plants) take in air only at <b>night</b> and store CO₂ as acids.</p>`]
 ],
